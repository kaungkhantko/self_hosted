services:
  # ─────────────────────────────────────────────
  # Navidrome Music Server
  navidrome:
    deploy:
      resources:
        limits:
          memory: 256m
    image: deluan/navidrome
    ports:
      - "4533:4533"
    volumes:
      - ./navidrome:/data
      - ${MEDIA_PATH}/Music:/music:ro
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # DuckDNS Dynamic IP Updater
  duckdns:
    deploy:
      resources:
        limits:
          memory: 64m
    image: linuxserver/duckdns
    container_name: duckdns
    environment:
      - SUBDOMAINS=kaungkhantko
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=false
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Caddy HTTPS Reverse Proxy
  caddy:
    deploy:
      resources:
        limits:
          memory: 256m
    image: caddy:latest
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - navidrome
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────
  # Jellyfin Media Server
  # GPU transcoding: set COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml in .env
  # After enabling GPU: Admin → Dashboard → Playback → Hardware Acceleration → NVIDIA NVENC
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    ports:
      - "8096:8096"
    environment:
      - JELLYFIN_PublishedServerUrl=http://media.kaungkhantko.duckdns.org
    volumes:
      - ./jellyfin_config:/config
      - ./jellyfin_cache:/cache
      - ${MEDIA_PATH}/TV:/media/tv:rw
      - ${MEDIA_PATH}/Movies:/media/movies:rw
      # media-watcher creates symlinks inside /media/tv and /media/movies that
      # point to /data/downloads/... — Jellyfin needs /data mounted so it can
      # follow those symlinks to the actual (partially) downloaded files.
      - ${MEDIA_PATH}:/data:ro
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "4.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8096/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ─────────────────────────────────────────────
  # n8n Workflow Automation
  # WEBHOOK_URL updated to public DuckDNS URL so GitHub webhooks can reach it
  # LAN access still works via n8n.lan (Caddy internal route)
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    user: "1000:1000"
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.kaungkhantko.duckdns.org
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.kaungkhantko.duckdns.org/
      - GENERIC_TIMEZONE=Asia/Rangoon
    volumes:
      - ./n8n:/home/node/.n8n
      - /mnt/media/Odoo-IFM/docs:/home/kaung/Odoo-IFM/docs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # qBittorrent — Torrent Download Client
  # Reach the WebUI at http://qbittorrent:8082
  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Rangoon
      - WEBUI_PORT=8082
      - WEBUI_ADDRESS=0.0.0.0
    ports:
      - "8082:8082"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./qbittorrent:/config
      - type: bind
        source: ${MEDIA_PATH}
        target: /data
        bind:
          propagation: slave
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # FlareSolverr — Cloudflare bypass proxy for Prowlarr
  # Prowlarr routes CF-protected indexers through this
  flaresolverr:
    deploy:
      resources:
        limits:
          memory: 256m
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Rangoon
    ports:
      - "8191:8191"
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Prowlarr — Torrent Indexer Manager
  # Connects to Radarr + Sonarr and manages all indexers in one place
  prowlarr:
    image: linuxserver/prowlarr
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Rangoon
    volumes:
      - ./prowlarr:/config
    ports:
      - "9696:9696"
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Radarr — Movie Collection Manager
  # Monitors /data/Movies, grabs movies via Prowlarr → qBittorrent
  radarr:
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Rangoon
    volumes:
      - ./radarr:/config
      - ${MEDIA_PATH}:/data
    ports:
      - "7878:7878"
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Sonarr — TV Series Collection Manager
  # Monitors /data/TV, grabs episodes via Prowlarr → qBittorrent
  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Rangoon
    volumes:
      - ./sonarr:/config
      - ${MEDIA_PATH}:/data
    ports:
      - "8989:8989"
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Lidarr — Music Collection Manager
  # Monitors /data/Music, grabs albums via Prowlarr → qBittorrent
  lidarr:
    image: linuxserver/lidarr
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Rangoon
    volumes:
      - ./lidarr:/config
      - ${MEDIA_PATH}:/data
    ports:
      - "8686:8686"
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Jellyseerr — Unified Media Request UI (Netflix-like)
  # Browse/search/request content → auto-routes to Radarr or Sonarr
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3.1.0
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Rangoon
    volumes:
      - ./jellyseerr:/app/config
    ports:
      - "5055:5055"
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Vaultwarden — Self-hosted Password Manager (Bitwarden-compatible)
  # Admin panel: https://vault.kaungkhantko.duckdns.org/admin
  # Use with the official Bitwarden browser extension / mobile app
  vaultwarden:
    deploy:
      resources:
        limits:
          memory: 256m
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - TZ=Asia/Rangoon
    volumes:
      - ./vaultwarden:/data
    ports:
      - "8089:80"
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Bazarr — Automatic Subtitle Management
  # After deploy: Settings → Providers → add OpenSubtitles.com (you have an account)
  # Settings → Sonarr: http://sonarr:8989, api key from sonarr/config.xml
  # Settings → Radarr: http://radarr:7878, api key from radarr/config.xml
  bazarr:
    image: linuxserver/bazarr
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Rangoon
    volumes:
      - ./bazarr:/config
      - ${MEDIA_PATH}:/data
    ports:
      - "6767:6767"
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # ntfy — Self-hosted Push Notification Server
  # After deploy, create an admin user:
  #   docker exec -it ntfy ntfy user add --role=admin kaung
  # Then subscribe to topics in the ntfy app (iOS/Android)
  # Jellyseerr: Settings → Notifications → Webhook → https://ntfy.kaungkhantko.duckdns.org/alerts
  ntfy:
    deploy:
      resources:
        limits:
          memory: 128m
    image: binwiederhier/ntfy
    container_name: ntfy
    command: serve
    environment:
      - TZ=Asia/Rangoon
      - NTFY_BASE_URL=https://ntfy.kaungkhantko.duckdns.org
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/cache/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_BEHIND_PROXY=true
    volumes:
      - ./ntfy:/var/cache/ntfy
    ports:
      - "2586:80"
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Uptime Kuma — Service Monitoring & Alerting Dashboard
  # After deploy: add monitors for all your services
  # Alert channel: ntfy → https://ntfy.kaungkhantko.duckdns.org/alerts
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    volumes:
      - ./uptime-kuma:/app/data
    ports:
      - "3001:3001"
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # ─────────────────────────────────────────────
  # Homepage — Modern, fully static service dashboard
  # Config lives in ./homepage/ — services.yaml, widgets.yaml, settings.yaml
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    env_file:
      - .env
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=192.168.1.2:3000,home.lan
    volumes:
      - ./homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Dozzle — Real-time Docker Log Viewer
  # Lightweight, read-only log viewer for all containers
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9999:8080"
    deploy:
      resources:
        limits:
          memory: 32m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Scrutiny — Hard Drive Health Monitoring (SMART data)
  # Monitors /dev/sda (OS drive) and /dev/sdb (Media DAS drive)
  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    cap_add:
      - SYS_RAWIO
    devices:
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
    volumes:
      - /run/udev:/run/udev:ro
      - ./scrutiny:/opt/scrutiny/config
    ports:
      - "8090:8080"
    deploy:
      resources:
        limits:
          memory: 128m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Readarr — Book & Manga Collection Manager
  # Root folder: /data/Books  (→ ${MEDIA_PATH}/Books on host)
  # Connect to Prowlarr for indexers and qBittorrent for downloads
  readarr:
    image: ghcr.io/linuxserver/readarr:amd64-nightly-version-0.4.19.2811  # pinned: multi-arch manifest is broken upstream, use explicit amd64 tag
    container_name: readarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Rangoon
    volumes:
      - ./readarr:/config
      - ${MEDIA_PATH}:/data
    ports:
      - "8787:8787"
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Calibre-Web — Book Reader & Library UI
  # First run: set library path to /books when prompted
  # DOCKER_MODS adds Calibre binaries for ebook conversion
  calibre-web:
    image: linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Rangoon
    volumes:
      - ./calibre-web:/config
      - ${MEDIA_PATH}/Books:/books
    ports:
      - "8083:8083"
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Immich — Self-hosted Google Photos replacement
  # Existing photos at ${PHOTOS_PATH}/Photos → add as External Library in Admin UI:
  #   Admin → External Libraries → Create → path: /mnt/personal/Photos
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    environment:
      - DB_HOSTNAME=immich-db
      - DB_USERNAME=immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
      - IMMICH_MACHINE_LEARNING_URL=http://immich-machine-learning:3003
      - TZ=Asia/Rangoon
    volumes:
      - ./immich_upload:/usr/src/app/upload
      - ${PHOTOS_PATH}/Photos:/mnt/personal/Photos:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2283:2283"
    depends_on:
      - immich-db
      - immich-redis
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Immich Machine Learning — CPU inference
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-machine-learning
    volumes:
      - immich_model_cache:/cache
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "4.0"
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Immich Redis (Valkey) — Job queue & cache
  immich-redis:
    deploy:
      resources:
        limits:
          memory: 128m
    image: docker.io/valkey/valkey:9
    container_name: immich-redis
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Immich Database — PostgreSQL 14 with pgvecto.rs for vector search
  # DB_STORAGE_TYPE=HDD because data lives on spinning disk
  immich-db:
    deploy:
      resources:
        limits:
          memory: 512m
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-db
    environment:
      - POSTGRES_USER=immich
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_DB=immich
      - DB_STORAGE_TYPE=HDD
    volumes:
      - ./immich_db:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────
  # media-watcher — Watch-while-downloading bridge
  # Polls qBittorrent for active downloads, cross-references Radarr/Sonarr
  # queues, and creates symlinks inside Jellyfin library folders so content
  # can be streamed the moment sequential downloading has buffered the start.
  # Symlinks are cleaned up automatically after Radarr/Sonarr complete import.
  media-watcher:
    deploy:
      resources:
        limits:
          memory: 128m
    build: ./media-watcher
    container_name: media-watcher
    environment:
      - QB_URL=http://qbittorrent:8082
      - QB_USER=admin
      - QB_PASS=${QB_PASS}
      - RADARR_URL=http://radarr:7878
      - RADARR_KEY=${RADARR_KEY}
      - SONARR_URL=http://sonarr:8989
      - SONARR_KEY=${SONARR_KEY}
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_KEY=${JELLYFIN_KEY}
      - MEDIA_PATH=/data
      - POLL_INTERVAL=30
      - MIN_PROGRESS=0.02
    volumes:
      - ${MEDIA_PATH}:/data
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # subtitle-cron — Daily subtitle downloader
  # Runs download_subs.py at 03:00 every day via busybox crond
  # Replaces the host cron job: 0 3 * * * /home/kaung/subliminal_venv/bin/python3 /home/kaung/download_subs.py
  subtitle-cron:
    deploy:
      resources:
        limits:
          memory: 64m
    build: ./subtitle-cron
    container_name: subtitle-cron
    restart: unless-stopped
    volumes:
      - ${MEDIA_PATH}:/mnt/media
    environment:
      - TZ=${TZ}

  # ─────────────────────────────────────────────
  # Actual Budget — Personal Finance / Budgeting
  # First run: open https://budget.lan and set a password
  # Data persisted at ./actual_data (SQLite — no external DB needed)
  actual-server:
    image: actualbudget/actual-server:latest
    container_name: actual-server
    volumes:
      - ./actual_data:/data
    ports:
      - "5006:5006"
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Firefly III — Self-hosted Personal Finance Manager
  # First run: open http://<host>:8080 to create admin account
  # Data Importer UI: http://<host>:8081
  firefly-db:
    image: postgres:16-alpine
    container_name: firefly-db
    environment:
      - POSTGRES_USER=firefly
      - POSTGRES_PASSWORD=${FIREFLY_DB_PASSWORD}
      - POSTGRES_DB=firefly
    volumes:
      - ./firefly_db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefly"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Firefly III — Main Application
  firefly-iii:
    image: fireflyiii/core:latest
    container_name: firefly-iii
    environment:
      - APP_ENV=production
      - APP_KEY=${FIREFLY_APP_KEY}
      - APP_URL=http://firefly.lan
      - DB_CONNECTION=pgsql
      - DB_HOST=firefly-db
      - DB_PORT=5432
      - DB_DATABASE=firefly
      - DB_USERNAME=firefly
      - DB_PASSWORD=${FIREFLY_DB_PASSWORD}
      - TZ=Asia/Rangoon
      - TRUSTED_PROXIES=**
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
    volumes:
      - ./firefly_data:/var/www/html/storage/upload
    ports:
      - "8080:8080"
    depends_on:
      firefly-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Firefly III — Data Importer (CSV / bank import UI)
  firefly-importer:
    image: fireflyiii/data-importer:latest
    container_name: firefly-importer
    environment:
      - FIREFLY_III_URL=http://firefly-iii:8080
      - VANITY_URL=http://firefly.lan
      - TZ=Asia/Rangoon
    ports:
      - "8081:8080"
    depends_on:
      - firefly-iii
    deploy:
      resources:
        limits:
          memory: 128m
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Odoo 19 — PostgreSQL database
  odoo_db:
    deploy:
      resources:
        limits:
          memory: 256m
    image: postgres:16
    container_name: odoo_db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=${ODOO_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────
  # Odoo 19 — CRM + Accounting (Community Edition)
  odoo:
    deploy:
      resources:
        limits:
          memory: 256m
    image: odoo:19
    container_name: odoo
    depends_on:
      - odoo_db
    environment:
      - HOST=odoo_db
      - USER=odoo
      - PASSWORD=${ODOO_DB_PASSWORD}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Paperless-ngx Redis — Job queue / broker
  paperless-redis:
    deploy:
      resources:
        limits:
          memory: 128m
    image: docker.io/valkey/valkey:9
    container_name: paperless-redis
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Paperless-ngx — Document Management with OCR
  # Consume folder (inbox): ${MEDIA_PATH}/Documents/paperless-consume/
  # After first deploy, create admin: docker compose exec paperless-ngx python manage.py createsuperuser
  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    depends_on:
      - paperless-redis
    environment:
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      - PAPERLESS_OCR_LANGUAGE=eng+mya
      - PAPERLESS_OCR_LANGUAGES=mya
      - PAPERLESS_TIME_ZONE=Asia/Yangon
      - PAPERLESS_URL=https://docs.lan
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
    volumes:
      - ./paperless:/usr/src/paperless/data
      - ${MEDIA_PATH}/Documents/paperless:/usr/src/paperless/media
      - ${MEDIA_PATH}/Documents/paperless-consume:/usr/src/paperless/consume
      - ${MEDIA_PATH}/Documents/paperless-export:/usr/src/paperless/export
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Writebook
  writebook:
    deploy:
      resources:
        limits:
          memory: 512m
    image: ghcr.io/basecamp/writebook:latest
    container_name: writebook
    volumes:
      - writebook_data:/rails/storage
    environment:
      - SECRET_KEY_BASE=${WRITEBOOK_SECRET_KEY_BASE}
      - DISABLE_SSL=true
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Forgejo — Self-hosted Git server (GitHub alternative)
  # Hosts the notes vault (Kaung-Notes-Vault) and future repos.
  # LAN: https://git.lan via Caddy (internal TLS).
  # Tailnet: loopback port 3002 consumed by `tailscale serve` (tailnet-only HTTPS).
  # SQLite backend — single-user, no extra DB container needed.
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    container_name: forgejo
    environment:
      - TZ=Asia/Rangoon
    volumes:
      - ./forgejo:/data
    ports:
      - "127.0.0.1:3002:3000"
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

